name: Build NeonDash IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: bash NeonDash/build.sh

      - name: Save IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDash-ipa
          path: NeonDash/build/NeonDash.ipa

      - name: Publish IPA as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neon Dash build ${{ github.run_number }}
          files: NeonDash/build/NeonDash.ipa
