<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Dash">
<title>Neon Dash</title>
<style>
html,body{margin:0;height:100%;background:#05050f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh}
</style></head><body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const H=400,GY=320;let W=800,S=1,dpr=1;
function rs(){dpr=Math.min(window.devicePixelRatio||1,3);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;S=cv.height/H;W=cv.width/S}
addEventListener('resize',rs);rs();

// ---------- сохранение ----------
let sv={coins:0,best:0,dbl:0,shield:0,magnet:0,bonus:0,skin:0,own:[0],runs:0,total:0};
try{Object.assign(sv,JSON.parse(window.__nd||localStorage.getItem('neondash1')||'{}'))}catch(e){}
const save=()=>{const s=JSON.stringify(sv);try{localStorage.setItem('neondash1',s)}catch(e){}try{window.webkit.messageHandlers.nd.postMessage(s)}catch(e){}};

const SKINS=[['Циан','#00e5ff',0],['Розовый','#ff3d9a',100],['Лайм','#b6ff00',250],['Золото','#ffd400',500],['Фиолет','#a46bff',800],['Белый','#ffffff',1500]];
const UPS=[
 ['dbl','Двойной прыжок',1,250],
 ['shield','Щит на старте',3,120],
 ['magnet','Магнит монет',5,100],
 ['bonus','Бонус монет +25%',8,90]];
const upCost=(k)=>{const u=UPS.find(x=>x[0]===k);return Math.round(u[3]*Math.pow(sv[k]+1,1.5))};
const BIOMES=[['#1a0b3d','#2d1b69','#00e5ff'],['#2b0a1f','#6b1b4d','#ff3d9a'],['#06222b','#0b5563','#b6ff00'],['#2b1a05','#6b4a0b','#ffd400'],['#0a0a2b','#1b2b6b','#a46bff']];
const BNAMES=['Неоновый город','Розовый закат','Кислотный лес','Золотая пустыня','Космос'];

// ---------- звук ----------
let ac;
function snd(f,d=.08,type='square',v=.04){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.value=v;o.connect(gn);gn.connect(ac.destination);o.start();gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

// ---------- состояние ----------
let state='menu',run=null,hold=false,btns=[],parts=[],T=0,msg='',msgT=0;
const stars=Array.from({length:60},()=>({x:Math.random()*2000,y:Math.random()*260,s:Math.random()*1.6+.4}));
const city=Array.from({length:60},(_,i)=>({w:30+Math.random()*50,h:40+Math.random()*120}));

function newRun(){
 run={px:0,dist:0,coins:0,v:300,p:{x:90,y:GY-28,vy:0,w:28,h:28,g:true,j:0},obs:[],cn:[],nx:520,shield:sv.shield,inv:0,rot:0,dead:0,earned:0,newBest:false};
 state='play';
}

function spawn(){
 const r=run,d=r.dist,x=r.nx,rnd=Math.random();
 let end=x;
 if(rnd<.28){
  const n=1+(Math.random()*Math.min(3,1+d/700)|0);
  for(let i=0;i<n;i++)r.obs.push({t:'s',x:x+i*26,w:26,h:26});
  end=x+n*26;arc(x+(end-x)/2-40,100,80);
 }else if(rnd<.5){
  const h=36+(Math.random()*3|0)*20,w=50+(Math.random()*3|0)*20;
  r.obs.push({t:'b',x,w,h});end=x+w;
  for(let i=0;i<3;i++)r.cn.push({x:x+w/2-30+i*30,y:GY-h-34});
 }else if(rnd<.7){
  const w=90+Math.min(90,d/12)+Math.random()*30;
  r.obs.push({t:'g',x,w,h:0});end=x+w;arc(x+w/2-40,110,80);
 }else if(rnd<.85&&d>150){
  r.obs.push({t:'b',x,w:44,h:40},{t:'b',x:x+44+40,w:44,h:80},{t:'b',x:x+88+80,w:44,h:40});
  end=x+88+80+44;r.cn.push({x:x+44+20,y:GY-120},{x:x+124+22,y:GY-160});
 }else if(rnd<.93&&d>300){
  r.obs.push({t:'s',x,w:26,h:26},{t:'b',x:x+120,w:50,h:56},{t:'s',x:x+120+50+70,w:26,h:26});
  end=x+120+50+70+26;arc(x-10,100,110);
 }else{
  for(let i=0;i<7;i++)r.cn.push({x:x+i*28,y:GY-40-Math.sin(i/6*Math.PI)*50});
  end=x+7*28;
 }
 r.nx=end+210+r.v*.34+Math.random()*110;
}
function arc(x,h,w){for(let i=0;i<5;i++){const t=i/4;r_cn(x+t*w,GY-28-Math.sin(t*Math.PI)*h)}}
function r_cn(x,y){run.cn.push({x,y})}

function die(){
 const r=run;
 if(r.inv>0)return;
 if(r.shield>0){r.shield--;r.inv=1.3;burst(r.p.x+14,r.p.y+14,'#7fffd4',22);snd(220,.2,'sawtooth',.06);return}
 burst(r.p.x+14,r.p.y+14,SKINS[sv.skin][1],40);snd(120,.4,'sawtooth',.07);
 r.earned=Math.floor(r.coins);sv.coins+=r.earned;sv.runs++;sv.total+=Math.floor(r.dist);
 if(Math.floor(r.dist)>sv.best){sv.best=Math.floor(r.dist);r.newBest=true}
 save();state='dead';r.dead=0;
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*240;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,l:.6+Math.random()*.5,c})}}

function jump(){
 const p=run.p;
 if(p.g){p.vy=-620;p.g=false;p.j=1;snd(520,.07);}
 else if(sv.dbl&&p.j<2){p.vy=-540;p.j=2;burst(p.x+14,p.y+28,'#fff',8);snd(700,.07);}
}

function update(dt){
 const r=run,p=r.p;
 r.v=Math.min(300+r.dist*.5,620);
 const dx=r.v*dt;r.px+=dx;r.dist=r.px/50;
 for(const o of r.obs)o.x-=dx;for(const c of r.cn)c.x-=dx;r.nx-=dx;
 r.obs=r.obs.filter(o=>o.x+o.w>-50);r.cn=r.cn.filter(c=>c.x>-50);
 while(r.nx<W+120)spawn();
 if(r.inv>0)r.inv-=dt;
 const prevB=p.y+p.h;
 p.vy+=(hold&&p.vy<0?1000:1900)*dt;p.y+=p.vy*dt;
 let over=false;
 for(const o of r.obs)if(o.t==='g'&&p.x+6>o.x&&p.x+p.w-6<o.x+o.w)over=true;
 let sup=over?1e9:GY;
 for(const o of r.obs)if(o.t==='b'&&p.x+p.w>o.x+3&&p.x<o.x+o.w-3){const top=GY-o.h;if(prevB<=top+14&&p.y+p.h>=top)sup=Math.min(sup,top)}
 if(p.vy>=0&&p.y+p.h>=sup&&prevB<=sup+14){p.y=sup-p.h;p.vy=0;if(!p.g){burst(p.x+14,p.y+28,'#ffffff55',4)}p.g=true;p.j=0}
 else{if(p.g&&p.j===0)p.j=1;p.g=false}
 if(p.g)r.rot=Math.round(r.rot/(Math.PI/2))*(Math.PI/2);else r.rot+=dt*9;
 // столкновения
 for(const o of r.obs){
  if(o.t==='s'){if(p.x+p.w-6>o.x+6&&p.x+6<o.x+o.w-6&&p.y+p.h>GY-o.h+8)die()}
  else if(o.t==='b'){const top=GY-o.h;if(p.x+p.w>o.x+2&&p.x<o.x+o.w-2&&p.y+p.h>top+5&&p.y<GY){if(!(p.g&&p.y+p.h<=top+1))die()}}
 }
 if(p.y>H+60){r.inv=0;r.shield=0;die()}
 if(state!=='play')return;
 // монеты
 const R=sv.magnet*45;
 for(const c of r.cn){
  const ddx=p.x+14-c.x,ddy=p.y+14-c.y,dd=Math.hypot(ddx,ddy);
  if(R&&dd<R+20){c.x+=ddx/dd*520*dt;c.y+=ddy/dd*520*dt}
  if(dd<24){c.got=1;r.coins+=1+.25*sv.bonus;snd(900+Math.random()*200,.05,'triangle',.05)}
 }
 r.cn=r.cn.filter(c=>!c.got);
 const bi=Math.floor(r.dist/600);
 if(bi!==r.lastBi){if(r.lastBi!==undefined){msg='Зона: '+BNAMES[bi%5];msgT=2.2;snd(440,.3,'triangle',.06)}r.lastBi=bi}
}

// ---------- UI ----------
function btn(x,y,w,h,label,fn,col){
 btns.push({x,y,w,h,fn});
 g.fillStyle='#0008';g.fillRect(x,y,w,h);
 g.strokeStyle=col||'#fff';g.lineWidth=2;g.strokeRect(x,y,w,h);
 g.fillStyle=col||'#fff';g.textAlign='center';g.textBaseline='middle';g.font='bold 18px -apple-system,Helvetica,sans-serif';
 g.fillText(label,x+w/2,y+h/2);
}
function txt(s,x,y,size,col,al){g.fillStyle=col||'#fff';g.textAlign=al||'center';g.textBaseline='middle';g.font='bold '+size+'px -apple-system,Helvetica,sans-serif';g.fillText(s,x,y)}

function draw(dt){
 g.setTransform(S,0,0,S,0,0);btns=[];
 const dist=run?run.dist:T*3,bi=Math.floor(dist/600)%5,B=BIOMES[bi];
 const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,B[0]);gr.addColorStop(1,B[1]);
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 const sc=(run?run.px:T*150);
 g.fillStyle='#fff';
 for(const s of stars){const x=((s.x-sc*.02*s.s)%W+W)%W;g.globalAlpha=.5;g.fillRect(x,s.y,s.s,s.s)}
 g.globalAlpha=1;
 g.fillStyle='#00000055';
 let cx=-((sc*.15)%2400);
 for(let i=0;cx<W;i++){const b=city[i%60];g.fillRect(cx,GY-b.h,b.w,b.h);cx+=b.w+6}
 // земля
 g.fillStyle='#07071a';g.fillRect(0,GY,W,H-GY);
 g.fillStyle=B[2];g.fillRect(0,GY,W,3);
 g.globalAlpha=.25;for(let x=-((sc)%60);x<W;x+=60)g.fillRect(x,GY+3,2,H-GY);g.globalAlpha=1;
 if(run){
  const r=run;
  for(const o of r.obs)if(o.t==='g'){g.fillStyle='#02020a';g.fillRect(o.x,GY,o.w,H-GY);g.fillStyle=B[2];g.fillRect(o.x-2,GY,2,H-GY);g.fillRect(o.x+o.w,GY,2,H-GY)}
  for(const o of r.obs){
   if(o.t==='s'){g.fillStyle='#ff2d55';g.shadowColor='#ff2d55';g.shadowBlur=10;g.beginPath();g.moveTo(o.x,GY);g.lineTo(o.x+o.w/2,GY-o.h);g.lineTo(o.x+o.w,GY);g.fill();g.shadowBlur=0}
   else if(o.t==='b'){g.fillStyle='#10102a';g.fillRect(o.x,GY-o.h,o.w,o.h);g.strokeStyle=B[2];g.lineWidth=2;g.shadowColor=B[2];g.shadowBlur=8;g.strokeRect(o.x,GY-o.h,o.w,o.h);g.shadowBlur=0}
  }
  for(const c of r.cn){g.fillStyle='#ffd400';g.shadowColor='#ffd400';g.shadowBlur=8;g.beginPath();g.arc(c.x,c.y,7,0,6.28);g.fill();g.shadowBlur=0}
  // игрок
  const p=r.p;
  if(state==='play'||r.inv>0&&state!=='dead'){
   if(r.inv<=0||Math.floor(T*20)%2===0){
    g.save();g.translate(p.x+14,p.y+14);g.rotate(r.rot);
    g.fillStyle=SKINS[sv.skin][1];g.shadowColor=SKINS[sv.skin][1];g.shadowBlur=14;g.fillRect(-14,-14,28,28);g.shadowBlur=0;
    g.fillStyle='#000a';g.fillRect(-7,-7,14,14);g.restore();
    if(r.shield>0){g.strokeStyle='#7fffd4';g.lineWidth=2;g.beginPath();g.arc(p.x+14,p.y+14,23,0,6.28);g.stroke()}
   }
   if(p.g&&state==='play'&&Math.random()<.5)parts.push({x:p.x,y:p.y+26,vx:-80-Math.random()*60,vy:-Math.random()*40,l:.3,c:SKINS[sv.skin][1]});
  }
 }
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.l-=dt;g.globalAlpha=Math.max(0,q.l*2);g.fillStyle=q.c;g.fillRect(q.x,q.y,4,4)}
 g.globalAlpha=1;parts=parts.filter(q=>q.l>0);

 if(state==='play'){
  txt(Math.floor(run.dist)+' м',W/2,28,26);
  txt('● '+Math.floor(run.coins),W-20,26,20,'#ffd400','right');
  if(run.shield>0)txt('🛡 '+run.shield,20,26,20,'#7fffd4','left');
  if(msgT>0){g.globalAlpha=Math.min(1,msgT);txt(msg,W/2,80,22,BIOMES[bi][2]);g.globalAlpha=1}
 }else if(state==='menu'){
  txt('NEON DASH',W/2,90,54,B[2]);
  txt('Рекорд: '+sv.best+' м   ·   Монеты: '+sv.coins,W/2,140,18,'#ddd');
  btn(W/2-110,180,220,56,'ИГРАТЬ',()=>newRun(),B[2]);
  btn(W/2-110,250,220,50,'МАГАЗИН',()=>{state='shop';msg=''},'#ffd400');
  txt('Тап = прыжок, держи для высокого. Забеги: '+sv.runs,W/2,350,14,'#aaa');
 }else if(state==='dead'){
  const r=run;r.dead+=dt;
  txt(r.newBest?'НОВЫЙ РЕКОРД!':'ТЫ РАЗБИЛСЯ',W/2,70,38,r.newBest?'#ffd400':'#ff2d55');
  txt(Math.floor(r.dist)+' м',W/2,125,40);
  txt('+'+r.earned+' монет   (всего '+sv.coins+')',W/2,170,20,'#ffd400');
  txt('Рекорд: '+sv.best+' м',W/2,198,16,'#ccc');
  btn(W/2-180,235,170,56,'ЕЩЁ РАЗ',()=>{if(run.dead>.35)newRun()},B[2]);
  btn(W/2+10,235,170,56,'МЕНЮ',()=>{if(run.dead>.35)state='menu'});
  btn(W/2-110,305,220,46,'МАГАЗИН',()=>{state='shop'},'#ffd400');
 }else if(state==='shop'){
  txt('МАГАЗИН',W/2,28,28,'#ffd400');txt('● '+sv.coins,W-20,28,20,'#ffd400','right');
  const x0=W/2-270;
  UPS.forEach((u,i)=>{
   const y=55+i*46,lv=sv[u[0]],mx=u[2],full=lv>=mx;
   g.fillStyle='#0008';g.fillRect(x0,y,540,40);
   txt(u[1]+'  ['+lv+'/'+mx+']',x0+12,y+20,16,'#fff','left');
   btn(x0+390,y+4,142,32,full?'МАКС':'Купить '+upCost(u[0]),()=>{if(full)return;const c=upCost(u[0]);if(sv.coins>=c){sv.coins-=c;sv[u[0]]++;save();snd(800,.1,'triangle',.06)}else{snd(150,.15,'sawtooth',.05)}},full?'#888':'#7fffd4');
  });
  txt('Цвет кубика',W/2,258,16,'#ccc');
  SKINS.forEach((s,i)=>{
   const x=W/2-270+i*90,y=272,own=sv.own.includes(i);
   g.fillStyle=s[1];g.shadowColor=s[1];g.shadowBlur=own?10:0;g.globalAlpha=own?1:.35;g.fillRect(x+25,y,30,30);g.shadowBlur=0;g.globalAlpha=1;
   if(sv.skin===i){g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(x+21,y-4,38,38)}
   btns.push({x:x,y:y-6,w:80,h:70,fn:()=>{if(own){sv.skin=i;save()}else if(sv.coins>=s[2]){sv.coins-=s[2];sv.own.push(i);sv.skin=i;save();snd(800,.1,'triangle',.06)}else snd(150,.15,'sawtooth',.05)}});
   txt(own?s[0]:s[2]+'●',x+40,y+50,12,own?'#fff':'#ffd400');
  });
  btn(W/2-70,345,140,42,'НАЗАД',()=>{state='menu'});
 }
}

// ---------- ввод ----------
function pt(e){return[e.clientX*dpr/S,e.clientY*dpr/S]}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(state==='play'){hold=true;jump();return}
 const[x,y]=pt(e);
 for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();break}}
},{passive:false});
addEventListener('pointerup',()=>{hold=false});
addEventListener('pointercancel',()=>{hold=false});
addEventListener('keydown',e=>{if(e.code==='Space'){if(state==='play'){hold=true;jump()}else if(state==='menu'||state==='dead')newRun()}});
addEventListener('keyup',e=>{if(e.code==='Space')hold=false});
document.addEventListener('gesturestart',e=>e.preventDefault());

let last=performance.now();
function loop(t){
 const dt=Math.min((t-last)/1000,1/30);last=t;T+=dt;if(msgT>0)msgT-=dt;
 if(state==='play')update(dt);
 draw(dt);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
